<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>TherianChat</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0d0f14; --surface: #161920; --border: #252830; --accent: #00e5a0; --accent2: #0099ff; --text: #e8eaf0; --muted: #5a5f72; --mono: 'Space Mono', monospace; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .logo { font-family: var(--mono); font-size: 1rem; font-weight: 700; color: var(--accent); }
    #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    #dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    #dot.off { background: #ff4d6d; }
    .header-right { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
    #mi-nombre { font-family: var(--mono); font-size: .75rem; color: var(--accent); }
    .header-right input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: .8rem; padding: 5px 10px; width: 130px; outline: none; }
    .btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 12px; font-size: .8rem; cursor: pointer; }
    .btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .main { display: flex; flex: 1; overflow: hidden; }
    aside { width: 210px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .aside-label { font-size: .72rem; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 14px 14px 8px; }
    #lista-usuarios { list-style: none; padding: 0 10px 10px; }
    #lista-usuarios li { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px; font-size: .92rem; }
    #lista-usuarios li::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    #lista-usuarios li.yo { color: var(--accent); font-weight: 600; }
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .chat-area::before { content: "Team Therians"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%) rotate(-25deg); font-size: 5rem; font-weight: 900; color: rgba(0,229,160,0.05); pointer-events: none; white-space: nowrap; letter-spacing: .2em; text-transform: uppercase; font-family: var(--mono); }
    #mensajes { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; position: relative; z-index: 1; }
    .burbuja { max-width: 68%; padding: 10px 14px; border-radius: 12px; font-size: .88rem; line-height: 1.45; }
    .burbuja.yo { align-self: flex-end; background: #0a2a1e; border: 1px solid #0d3d2a; }
    .burbuja.otro { align-self: flex-start; background: #1a1d26; border: 1px solid var(--border); }
    .burbuja .autor { font-family: var(--mono); font-size: .68rem; color: var(--accent2); margin-bottom: 3px; }
    .burbuja.yo .autor { color: var(--accent); }
    .burbuja .hora { font-size: .65rem; color: var(--muted); margin-top: 4px; text-align: right; }
    .sistema { align-self: center; background: #12141b; border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: .74rem; color: var(--muted); font-family: var(--mono); }
    .input-bar { display: flex; gap: 10px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); }
    #input-msg { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: .9rem; padding: 10px 14px; outline: none; }
    #btn-enviar { background: var(--accent); border: none; border-radius: 10px; color: #000; font-weight: 700; padding: 0 20px; cursor: pointer; }
    #btn-enviar:disabled { opacity: .3; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="logo">Therian<span style="color:var(--text)">Chat</span></div>
      <div style="font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em">Plataforma Colaborativa Corporativa</div>
    </div>
    <div id="dot"></div>
    <div class="header-right">
      <span id="mi-nombre">-</span>
      <input id="input-nombre" placeholder="Nuevo nombre..." maxlength="20" />
      <button class="btn" onclick="cambiarNombre()">Cambiar</button>
    </div>
  </header>
  <div class="main">
    <aside>
      <div style="padding:14px 14px 4px">
        <div style="font-size:.7rem;font-weight:700;color:var(--accent);font-family:var(--mono)">Team Therians</div>
        <div style="font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px">Colaboradores</div>
      </div>
      <div style="height:1px;background:var(--border);margin:8px 14px"></div>
      <div class="aside-label">En línea</div>
      <ul id="lista-usuarios"></ul>
    </aside>
    <div class="chat-area">
      <div id="mensajes"></div>
      <div class="input-bar">
        <input id="input-msg" placeholder="Escribe un mensaje..." maxlength="500" autocomplete="off" />
        <button id="btn-enviar" disabled onclick="enviarMensaje()">Enviar</button>
      </div>
    </div>
  </div>
  <script>
    const elMensajes   = document.getElementById("mensajes");
    const elInputMsg   = document.getElementById("input-msg");
    const elBtnEnviar  = document.getElementById("btn-enviar");
    const elDot        = document.getElementById("dot");
    const elMiNombre   = document.getElementById("mi-nombre");
    const elListaUsers = document.getElementById("lista-usuarios");
    let miUsername = "", ws;

    // Conectar al servidor WebSocket
    function conectar() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onopen  = () => { elDot.className = "on"; elBtnEnviar.disabled = false; };
      ws.onclose = () => { elDot.className = "off"; elBtnEnviar.disabled = true; setTimeout(conectar, 3000); };
      ws.onerror = () => ws.close();
      ws.onmessage = ({ data }) => {
        const msg = JSON.parse(data);
        if (msg.tipo === "bienvenida") { miUsername = msg.username; elMiNombre.textContent = miUsername; }
        if (msg.tipo === "historial")  msg.mensajes.forEach(m => agregarMensaje(m));
        if (msg.tipo === "mensaje")    agregarMensaje(msg);
        if (msg.tipo === "sistema")    { agregarSistema(msg.texto); actualizarUsuarios(msg.usuarios); }
        if (msg.tipo === "renombrado") { miUsername = msg.username; elMiNombre.textContent = miUsername; }
      };
    }

    // Agregar burbuja de mensaje
    function agregarMensaje(msg) {
      const d = document.createElement("div");
      d.className = `burbuja ${msg.username === miUsername ? "yo" : "otro"}`;
      d.innerHTML = `<div class="autor">${msg.username}</div><div>${escapeHTML(msg.texto)}</div><div class="hora">${msg.hora}</div>`;
      elMensajes.appendChild(d);
      elMensajes.scrollTop = elMensajes.scrollHeight;
    }

    // Agregar notificacion del sistema
    function agregarSistema(texto) {
      const d = document.createElement("div");
      d.className = "sistema";
      d.textContent = texto;
      elMensajes.appendChild(d);
      elMensajes.scrollTop = elMensajes.scrollHeight;
    }

    // Actualizar lista de usuarios
    function actualizarUsuarios(usuarios) {
      elListaUsers.innerHTML = usuarios.map(u =>
        `<li class="${u === miUsername ? "yo" : ""}">${u}</li>`
      ).join("");
    }

    // Enviar mensaje
    function enviarMensaje() {
      const texto = elInputMsg.value.trim();
      if (!texto || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ tipo: "mensaje", texto }));
      elInputMsg.value = "";
    }

    // Cambiar nombre
    function cambiarNombre() {
      const nombre = document.getElementById("input-nombre").value.trim();
      if (!nombre) return;
      ws.send(JSON.stringify({ tipo: "renombrar", username: nombre }));
      document.getElementById("input-nombre").value = "";
    }

    // Escapar HTML
    function escapeHTML(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    elInputMsg.addEventListener("keydown", e => { if (e.key === "Enter") enviarMensaje(); });
    document.getElementById("input-nombre").addEventListener("keydown", e => { if (e.key === "Enter") cambiarNombre(); });

    conectar();
  </script>
</body>
</html>
